  - id: agent_rules
    layout: content
    kicker: 如何使用 AI Agent（二）
    title: 讓多個 agent 平行又不互相破壞的規則
    blocks:
      - type: card
        box: [0.6, 1.8, 5.9, 2.25]
        heading: 佔位 job + srun --jobid
        body: '主 agent 先配置好 SLURM 佔位 job；agent 只能用 srun --jobid --overlap 進去跑，不在 login node 運算、也不自己送 job'
      - type: card
        box: [6.83, 1.8, 5.9, 2.25]
        heading: 每個優化獨立 commit、獨立 worktree
        body: 'B、C 各自在自己的 git worktree 改不同檔案；同節點 A/B 3 次取中位數才算數'
      - type: card
        box: [0.6, 4.3, 5.9, 2.25]
        heading: 先驗證、再報數字
        body: '輸出比對 + MFC regression test 都過才進結果表；負面結果也照實記錄'
      - type: card
        box: [6.83, 4.3, 5.9, 2.25]
        fill: accent_tint
        heading: 共享工作日誌 AGENT_LOG.md
        body: '實例：MFC 的 git pre-commit hook 會跑 precheck -j 12；lane B、C 各在 login node 觸發一次 → 立刻中止並寫進日誌，之後 commit 一律在佔位 job 內執行'
    source: 來源：AGENT_LOG.md；results/C/claims.md
    notes: |
      規則有三條：主 agent 預先配置佔位 job，其他 agent 只能用 srun 進去跑，不在登入節點運算、也不自己送 job；每條線改不同檔案，每個優化是獨立 commit；先驗證再報數字，失敗也照實記錄。共同的坑，例如 git hook 在登入節點跑檢查、每次執行寫出 29 GB，踩到一次就寫進共享日誌，其他線就不會再踩。主 agent 也做了幾個關鍵決定：不是逐位元相同的 B3 單獨成一個設定，上游的 case-optimization 和我們的改動分開報告，還沒驗證完的 E1 和 B5 不放進最終版。

