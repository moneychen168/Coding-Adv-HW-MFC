        body: '<m>m_weno.fpp:918–1060（933e55ba）</m>\nB1 之後 WENO 仍佔 24.7 %，主要成本是 FP64 除法 → 非線性權重改成分子 / 分母交叉相乘，mapped WENO3 每格每變數除法 16 → 4 次'
