<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Used via FONTCONFIG_FILE in render.sh (fonts dir reused read-only from HW3): adds Noto Sans CJK TC and maps Windows CJK font names to it. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/work/$USER/hw3_comd/deliver_tools/fonts</dir>
  <cachedir>$WORK/deliver_build/fc-cache</cachedir>
  <alias binding="same"><family>Microsoft JhengHei</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>微軟正黑體</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>Microsoft JhengHei UI</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
</fontconfig>
